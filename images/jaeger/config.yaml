# Jaeger v2 설정 — pi-gateway의 trace 저장소 (docker-compose.yml의 jaeger 서비스).
# OTLP/HTTP(4318)로 span을 받아 Badger(디스크)에 7일 동안 둔다. 조회는 gateway가 16686의 /api/v3로 한다.
service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  jaeger_query:
    storage:
      traces: badger
  jaeger_storage:
    backends:
      badger:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false
          ttl:
            spans: 168h

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: badger
